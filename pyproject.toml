[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-einvoice"
version = "0.1.0.dev0"
description = "A mock e-invoicing partner: EN 16931 invoices in and out, with the responses that follow. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["e-invoicing", "en16931", "ubl", "peppol", "xrechnung", "invoice",
            "mock", "testing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Testing",
]
# The standard library and nothing else, to run and to test.
dependencies = []

[project.urls]
Repository = "https://github.com/rseufert/mock-einvoice"
Issues = "https://github.com/rseufert/mock-einvoice/issues"
Changelog = "https://github.com/rseufert/mock-einvoice/blob/main/CHANGELOG.md"

# Only the package goes in the wheel, and the package is MIT. The sdist also
# carries the tests and the published examples they read, which are under
# their own licences: see tests/samples/external.
[tool.setuptools]
packages = ["mockeinvoice", "mockeinvoice.rules"]
