[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-einvoice"
version = "0.2.0"
description = "A mock e-invoicing partner: EN 16931 invoices in and out, with the responses that follow. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT AND EUPL-1.2" }
keywords = ["e-invoicing", "en16931", "ubl", "peppol", "xrechnung", "invoice",
            "mock", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Testing",
]
# The standard library and nothing else, to run and to test.
dependencies = []

[project.scripts]
mock-einvoice = "mockeinvoice.server:main"

[project.urls]
Repository = "https://github.com/rseufert/mock-einvoice"
Issues = "https://github.com/rseufert/mock-einvoice/issues"
Changelog = "https://github.com/rseufert/mock-einvoice/blob/main/CHANGELOG.md"

# Only the package goes in the wheel. The package is MIT but for two files,
# `rules/codelists.py` and `rules/ublsyntax.py`: the code lists and the paths
# of the published EN 16931 rules, which are under the EUPL 1.2 and go with
# its text beside them. The sdist also
# carries the tests and the published examples they read, which are under
# their own licences: see tests/samples/external.
[tool.setuptools]
packages = ["mockeinvoice", "mockeinvoice.rules"]

[tool.setuptools.package-data]
"mockeinvoice.rules" = ["LICENSE-EUPL-1.2.txt"]
